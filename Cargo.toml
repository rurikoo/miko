[package]
name = "miko"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A library for using Google Play via Aurora Store's dispenser"

[lib]
doctest = false
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
gpapi = { git = "https://github.com/rurikoo/gplay" }
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[dev-dependencies]
zip = "=9.1.0"
